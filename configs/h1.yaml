experiment:
  name: H1_MultiView_LocalContext
  seed: 42

data:
  num_views: 9
  image_size: 512
  image_channels: 1
  max_boxes_per_view: 30

model:
  backbone:
    name: resnet18
    pretrained: true
    freeze: true

  fpn:
    out_channels: 128

  roi:
    output_size: 7
    context_scales: [1.0, 3.0, 5.0]

  fusion:
    embedding_dim: 256

  transformer:
    num_layers: 2
    num_heads: 4
    hidden_dim: 256
    dropout: 0.1

  matching:
    hidden_dim: 128

training:
  batch_size: 2
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0001

evaluation:
  metrics:
    - matching_precision
    - matching_recall
    - matching_f1
    - recall_at_1